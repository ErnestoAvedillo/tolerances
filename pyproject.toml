[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytolerance"
version = "0.0.5"
description = "This is a tool to generate tolerance calculations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "build>=1.5.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pint>=0.23",
    "pydantic>=2.6",
    "scipy>=1.11",
    "twine>=6.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytolerance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
