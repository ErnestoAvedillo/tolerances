[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytolerance"
version = "0.0.2"
description = "This is a tool to generate tolerance calculations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "build>=1.5.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pint>=0.25.3",
    "pydantic>=2.13.4",
    "scipy>=1.17.1",
    "twine>=6.2.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]